<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MENTOR STUDIO</title>
  <link rel="icon" type="image/svg+xml" href="icon.svg" />
  <link rel="stylesheet" href="css/style.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <header class="nav">
    <div class="nav-inner">
      <a class="nav-brand" href="#">MENTOR STUDIO</a>
      <nav id="variant-nav" class="nav-links"></nav>
      <span class="nav-spacer"></span>
    </div>
  </header>

  <main id="viewport"></main>

  <div id="paint" class="paint"></div>

  <button id="info-toggle" class="info-toggle" aria-expanded="false" aria-controls="info-panel">
    Umsetzung &amp; 3D-Druck
  </button>
  <aside id="info-panel" class="info-panel" hidden>
    <header class="info-head">
      <div>
        <p class="info-kicker">Umsetzung &amp; 3D-Druck</p>
        <h2 id="info-title"></h2>
      </div>
      <button id="info-close" class="info-close" aria-label="Schliessen">×</button>
    </header>
    <p class="info-printer">Bambu Lab X2D (FHGR UX Lab, B-Gebäude) · Bauraum 256 × 256 × 260 mm, mit beiden Düsen 235 × 256 × 256 mm</p>
    <div id="info-body"></div>
  </aside>

  <script type="module" src="js/main.js"></script>
</body>
</html>
